# ===============================
# APP
# ===============================
server.port=8080
spring.application.name=lentes-y-marcos-opticos-backend

# ===============================
# DATABASE (PostgreSQL in Docker)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/lmopticos
spring.datasource.username=${DB_USERNAME:lmopticos_user}
spring.datasource.password=${DB_PASSWORD:lmopticos_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:change-this-secret-key-in-production-it-should-be-at-least-256-bits-long-for-hs512}
jwt.access-expiration=900000
jwt.refresh-expiration=1296000000

# ===============================
# COOKIES (refresh token)
# ===============================
cookie.secure=false
cookie.same-site=lax
cookie.domain=
cookie.path=/api/auth

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://lentesymarcosopticos.com}

# ===============================
# EMAIL
# ===============================
email.mode=console
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# WOMPI (configure with real keys later)
# ===============================
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.base-url=https://sandbox.wompi.co/v1
wompi.webhook-secret=${WOMPI_WEBHOOK_SECRET:}

# ===============================
# GOOGLE CALENDAR
# ===============================
google.calendar.credentials-path=classpath:credentials.json

# ===============================
# GOOGLE OAUTH (ID token verification)
# ===============================
google.oauth.client-id=${GOOGLE_CLIENT_ID:1004396310003-bkf8uh8tkf3n535m73u4gi3qmhebrhjl.apps.googleusercontent.com}

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.lmopticos=DEBUG
