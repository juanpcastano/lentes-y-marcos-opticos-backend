# ===============================
# APP
# ===============================
# Archivo de entorno: .sandbox.env por defecto. Para producción: APP_ENV=prod
spring.config.import=optional:file:.${APP_ENV:sandbox}.env[.properties]
server.port=8080
spring.application.name=lentes-y-marcos-opticos-backend

# ===============================
# DATABASE (PostgreSQL in Docker)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/lmopticos
spring.datasource.username=${DB_USERNAME:lmopticos_user}
spring.datasource.password=${DB_PASSWORD:lmopticos_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:change-this-secret-key-in-production-it-should-be-at-least-256-bits-long-for-hs512}
jwt.access-expiration=900000
jwt.refresh-expiration=1296000000
jwt.registration-expiration=900000

# ===============================
# COOKIES (refresh token)
# ===============================
cookie.secure=false
cookie.same-site=lax
cookie.domain=
cookie.path=/api/auth
cookie.device-max-age-seconds=${COOKIE_DEVICE_MAX_AGE_SECONDS:15552000}

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://lentesymarcosopticos.com}

# ===============================
# WHATSAPP (OTP y notificaciones)
# ===============================
whatsapp.mode=${WHATSAPP_MODE:console}
whatsapp.meta.base-url=${WHATSAPP_META_BASE_URL:https://graph.facebook.com/v21.0}
whatsapp.meta.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.meta.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.meta.template=${WHATSAPP_TEMPLATE:otp_acceso}
whatsapp.meta.language=${WHATSAPP_LANGUAGE:es}

# Tope diario de OTP por WhatsApp y alertas de abuso.
whatsapp.daily-limit=${WHATSAPP_DAILY_LIMIT:500}
whatsapp.daily-alert-threshold=${WHATSAPP_DAILY_ALERT_THRESHOLD:400}
whatsapp.spike-window-minutes=${WHATSAPP_SPIKE_WINDOW_MINUTES:5}
whatsapp.spike-threshold=${WHATSAPP_SPIKE_THRESHOLD:50}
whatsapp.spike-alert-cooldown-minutes=${WHATSAPP_SPIKE_ALERT_COOLDOWN_MINUTES:15}

# ===============================
# CAPTCHA
# ===============================
captcha.mode=${CAPTCHA_MODE:disabled}
captcha.turnstile.verify-url=${CAPTCHA_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
captcha.turnstile.secret=${CAPTCHA_SECRET:}

# ===============================
# LEGAL
# ===============================
legal.consent-version=${CONSENT_VERSION:2026-11}

# ===============================
# WOMPI (configure with real keys later)
# ===============================
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.base-url=https://sandbox.wompi.co/v1
wompi.webhook-secret=${WOMPI_WEBHOOK_SECRET:}

# ===============================
# GOOGLE CALENDAR
# ===============================
google.calendar.credentials-path=classpath:credentials.json

# ===============================
# AWS S3 (product images) — empty bucket disables upload (503)
# ===============================
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_S3_REGION:us-east-2}
aws.s3.public-url-base=${AWS_S3_PUBLIC_URL_BASE:}

# ===============================
# MULTIPART (image uploads)
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.lmopticos=DEBUG

# ===============================
# SOFTIX
# ===============================
softix.base-url=${SOFTIX_BASE_URL:https://api.softix.app}
softix.email=${SOFTIX_EMAIL:}
softix.password=${SOFTIX_PASSWORD:}
softix.connect-timeout-ms=${SOFTIX_CONNECT_TIMEOUT_MS:3000}
softix.read-timeout-ms=${SOFTIX_READ_TIMEOUT_MS:10000}
softix.branch-ids=${SOFTIX_BRANCH_IDS:}
softix.creation-branch=${SOFTIX_CREATION_BRANCH:1}
softix.created-by=${SOFTIX_CREATED_BY:1}
softix.placeholder-email-domain=${SOFTIX_PLACEHOLDER_EMAIL_DOMAIN:sin-correo.invalid}
softix.sync.cron=${SOFTIX_SYNC_CRON:0 0 * * * *}
softix.index.cron=${SOFTIX_INDEX_CRON:0 5 * * * *}
softix.write-events.cleanup-cron=${SOFTIX_WRITE_EVENTS_CLEANUP_CRON:0 30 3 * * *}
softix.index.seed-on-startup=${SOFTIX_INDEX_SEED_ON_STARTUP:false}
